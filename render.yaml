services:
  - type: web
    name: seig-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Keep one memory-efficient worker and allow the AI provider's cold start
    # to complete before Gunicorn aborts the request.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --graceful-timeout 30 --keep-alive 5
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_URLS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: ADMIN_EMAILS
        sync: false
      - key: RATELIMIT_STORAGE_URI
        value: memory://
